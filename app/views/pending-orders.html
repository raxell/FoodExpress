<div class="uk-width-1-1 uk-container-center uk-margin-large-bottom">
    <?php if (count($order_ids) === 0): ?>
        <div class="uk-alert uk-alert-info uk-text-center">
            Nessun ordine in attesa, tutti gli eventuali ordini sono stati evasi.
        </div>
    <?php else: ?>
        <h1>Ordini in attesa</h1>
        <?php foreach ($order_ids as $id): ?>
            <table class="uk-table uk-margin-large-bottom">
                <caption>Ordine #<?= $id ?> del <?= $orders_data[array_search($id, array_column($orders_data, 'ordine_id'))]['data'] ?></caption>
                <thead>
                    <tr>
                        <th class="uk-width-2-3">Piatto</th>
                        <th class="uk-width-1-3">Minuti mancanti</th>
                    </tr>
                </thead>
                <tbody>
                    <?php foreach ($orders_data as $data): ?>
                        <?php if ($data['ordine_id'] === $id): ?>
                            <tr>
                                <td><?= $data['titolo'] ?></td>
                                <td><?= $data['minuti_mancanti'] ?></td>
                            </tr>
                        <?php endif; ?>
                    <?php endforeach; ?>
                </tbody>
            </table>
        <?php endforeach; ?>
    <?php endif; ?>
</div>
